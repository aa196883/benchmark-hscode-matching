[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hs-matching"
version = "0.1.0"
description = "Benchmark de correspondance produit vers HS 2022"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
embeddings = ["numpy>=1.24,<3"]
web = ["Flask>=3.1,<4", "numpy>=1.24,<3"]
visual = ["playwright>=1.50,<2"]

[project.scripts]
hs-matching = "hs_matching.cli:main"
hs-matching-web = "hs_matching.web:main"

[tool.setuptools.packages.find]
include = ["hs_matching*"]

[tool.setuptools.package-data]
hs_matching = ["templates/*.html", "templates/cards/*.html", "static/*.css", "static/*.js"]

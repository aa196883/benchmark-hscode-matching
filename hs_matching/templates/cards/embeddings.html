{% if card.candidate.score is not none %}<div class="similarity"><div><span>Similarité cosinus</span><strong>{{ '%.3f'|format(card.candidate.score) }}</strong></div><meter min="-1" max="1" value="{{ card.candidate.score }}" aria-label="Similarité cosinus">{{ card.candidate.score }}</meter><div class="score-track" aria-hidden="true"><span style="width: {{ card.meter }}%"></span></div></div>{% endif %}
